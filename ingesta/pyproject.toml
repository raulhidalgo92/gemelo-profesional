# Gemelo digital profesional · TFG Grado en Ingeniería Informática (UNIR)
[project]
name = "gemelo-ingesta"
version = "0.1.0"
description = "Procesos de ingesta y normalización de datos del mercado laboral"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Raúl Hidalgo Calvo" }]
dependencies = [
  "gemelo-core",
  "apscheduler>=3.10,<4",
  "xlrd>=2,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingesta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
