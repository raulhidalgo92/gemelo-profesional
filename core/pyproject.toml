# Gemelo digital profesional · TFG Grado en Ingeniería Informática (UNIR)
[project]
name = "gemelo-core"
version = "0.1.0"
description = "Modelo de datos, configuración y utilidades compartidas del gemelo digital profesional"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Raúl Hidalgo Calvo" }]
dependencies = [
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "httpx>=0.27,<1",
  "google-genai>=1.0,<3",
  "google-auth>=2.30,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemelo_core"]
