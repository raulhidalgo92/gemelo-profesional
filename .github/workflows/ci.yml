# Gemelo digital profesional · TFG Grado en Ingeniería Informática (UNIR)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gemelo
          POSTGRES_PASSWORD: gemelo
          POSTGRES_DB: gemelo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gemelo" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gemelo:gemelo@localhost:5432/gemelo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./core -e "./backend[dev]" -e "./ingesta[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: cd core && pytest
      - run: cd backend && pytest
      - run: cd ingesta && pytest
      - name: Migraciones (SQL offline)
        working-directory: backend
        run: alembic upgrade head --sql > /dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false
