# Gemelo digital profesional · TFG Grado en Ingeniería Informática (UNIR)
# Entorno de desarrollo:  docker compose up --build
name: gemelo

services:
  db:
    container_name: gemelo-db
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gemelo}
      POSTGRES_USER: ${POSTGRES_USER:-gemelo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PUERTO_DB:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    container_name: gemelo-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PUERTO_API:-8000}:8000"
    volumes:
      - ./backend/app:/srv/backend/app
      - ./backend/migrations:/srv/backend/migrations
      - ./backend/tests:/srv/backend/tests
      - ./core/src/gemelo_core:/srv/core/src/gemelo_core
      - ./secretos:/run/secretos:ro
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  ingesta:
    container_name: gemelo-ingesta
    build:
      context: .
      dockerfile: ingesta/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./ingesta/src/ingesta:/srv/ingesta/src/ingesta
      - ./ingesta/tests:/srv/ingesta/tests
      - ./core/src/gemelo_core:/srv/core/src/gemelo_core
      - ./secretos:/run/secretos:ro
    command: ["python", "-m", "ingesta", "programador"]

  frontend:
    container_name: gemelo-frontend
    build:
      context: frontend
      target: desarrollo
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PUERTO_WEB:-4200}:4200"
    volumes:
      - ./frontend/src:/app/src

  # Visor web de la base de datos (solo desarrollo, accesible solo desde este equipo)
  adminer:
    container_name: gemelo-adminer
    image: adminer:5.4.1
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:${PUERTO_ADMINER:-8090}:8080"

volumes:
  pgdata:
