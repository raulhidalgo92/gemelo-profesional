<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block titulo %}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f6;font-family:-apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;color:#17171c;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f6;padding:40px 16px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;border:1px solid #e7e7ec;">
<tr><td style="padding:36px 36px 8px 36px;">
<div style="font-size:15px;font-weight:600;letter-spacing:-0.01em;color:#17171c;">
<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#5b4ff5;margin-right:8px;vertical-align:middle;"></span>Gemelo profesional
</div>
</td></tr>
<tr><td style="padding:20px 36px 36px 36px;font-size:15px;line-height:1.6;color:#3a3a45;">
{% block contenido %}{% endblock %}
</td></tr>
</table>
<p style="max-width:480px;margin:20px auto 0;font-size:12px;line-height:1.5;color:#8a8a96;text-align:center;">
Has recibido este correo porque alguien usó esta dirección en Gemelo profesional. Si no fuiste tú, ignóralo: no se activará ninguna cuenta.
</p>
</td></tr>
</table>
</body>
</html>
